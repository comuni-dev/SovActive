<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | SovActive Shop</title>
    <link rel="icon" type="image/png" href="img/logo-circular.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #0f1115, #1a1d24);
            color: #fff;
            padding: 20px;
            transition: background 0.4s;
        }

        body.light-theme {
            background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
            color: #1a1d24;
        }

        .card {
            background: #1a1d24;
            border: 1px solid rgba(255,255,255,0.08);
            padding: 48px 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            transition: background 0.4s, border 0.4s;
        }

        body.light-theme .card {
            background: #ffffff;
            border: 1px solid rgba(0,0,0,0.06);
            box-shadow: 0 20px 50px rgba(0,0,0,0.08);
        }

        .card i.big {
            font-size: 3rem;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
        }

        .card h1 { font-size: 1.5rem; margin-bottom: 8px; }

        .card p {
            color: #9ca3af;
            font-size: 0.9rem;
            margin-bottom: 28px;
        }

        body.light-theme .card p { color: #64748b; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
            font-family: inherit;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.35);
        }

        .btn:disabled { opacity: 0.7; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="card">
        <i class="fa-solid fa-circle-check big"></i>
        <h1>Panel administrativo</h1>
        <p id="welcomeText">Has iniciado sesión correctamente.</p>

        <button class="btn" id="logoutBtn">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Cerrar sesión</span>
        </button>
    </div>

    <script type="module" src="js/auth.js"></script>
    <script>
        // Mostrar el correo del usuario logueado
        const userEmail = localStorage.getItem("sovactive-user");
        if (userEmail) {
            document.getElementById("welcomeText").textContent =
                `Bienvenido, ${userEmail}`;
        }

        // Botón cerrar sesión con spinner
        document.getElementById("logoutBtn").addEventListener("click", async (e) => {
            const btn = e.currentTarget;
            const span = btn.querySelector("span");
            const icon = btn.querySelector("i");

            btn.disabled = true;
            icon.style.display = "none";
            span.innerHTML = `<span class="sov-spinner"></span>Cerrando...`;

            // Pequeño delay para que se vea el spinner antes de salir
            setTimeout(() => window.cerrarSesion(), 400);
        });
    </script>

</body>
</html>
